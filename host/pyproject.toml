[project]
name = "wamo-host"
version = "0.6.0"
description = "WAMO-Host: Windows-Werkzeugserver (MCP) mit Freigabe-Klassen"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "mss>=10.2.0",
    "pillow>=13.0.0",
    "pywin32>=308; sys_platform == 'win32'",
    # UI Automation (Fenster-Elemente ohne Mausübernahme, uia_control.py): MIT-Lizenz, reines Python, bewusst direkt
    # statt über ein Aufsatzpaket mit eigener Maus- und Tastatursteuerung. Exakt gepinnt.
    "comtypes==1.4.17; sys_platform == 'win32'",
    # Office-Dateien aus dem Canvas (office_dateien.py): Word, Excel und PowerPoint entstehen im Host ohne Office,
    # nur aus Inhalten, die der Host selbst prüft. MIT-Lizenz, exakt gepinnt, Hashes in uv.lock.
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
markers = ["office: braucht Word oder OneNote am Windows-PC (nur mit WAMO_OFFICE_ECHT=1)"]
