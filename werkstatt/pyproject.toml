[project]
name = "wamo-werkstatt"
version = "0.1.0"
description = "WAMO Werkstatt: Dienst des Admin-Panels (Dashboards, Protokolle, Labor-Planer, Kartenkatalog)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "coverage>=7.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["wamo_werkstatt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
