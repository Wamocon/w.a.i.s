# Ergänzung zum Compose-Projekt supabase-wamo: Sitzungsgrenzen von GoTrue (Auth).
# Eingebunden über COMPOSE_FILE in /home/wamocon/supabase-wamo/.env, gesetzt durch
# infra/sokrates2/supabase-wamo-einrichten.sh (Schritt 3b). Die Werte stehen in derselben .env.
#
# Namen geprüft gegen supabase/gotrue v2.196.0 (Struktur-Tags im Programm: sessions.timebox und
# sessions.inactivity_timeout mit split_words), also GOTRUE_SESSIONS_TIMEBOX und GOTRUE_SESSIONS_INACTIVITY_TIMEOUT.
#   Zeitbox:      Eine Sitzung lässt sich nach dieser Zeit ab der Anmeldung nicht mehr erneuern (harte Grenze,
#                 passend zu WAMO_ANMELDUNG_MAX_STUNDEN im Voice-Core, Standard 168h).
#   Inaktivität:  Wird eine Sitzung so lange nicht erneuert (App und Browser zu), endet sie.
# Das laufende Access-Token gilt danach noch bis zu seinem Ablauf (JWT_EXPIRY); der Voice-Core prüft das Alter selbst.
#
# Passwortwechsel (Befund des Token-Tests vom 12.11.2026, infra/sokrates2/labor_tokentest.py): Ohne diese Einstellung ändert ein Konto mit
# aal2-Token sein Passwort ohne erneute Anmeldung, ein Laborbesucher könnte den Platz für den Nächsten sperren.
# GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: Der Wechsel verlangt einen Bestätigungscode (Nonce) aus einer erneuten
# Anmeldung. Struktur-Tag security.update_password_require_reauthentication im Programm von v2.196.0 geprüft. Gemessen in P0 (15.11.2026,
# Wegwerf-Stack): GoTrue verlangt den Code nur bei Sitzungen über 24 Stunden; frische Sitzungen schützt die Sperre in Caddy (wamo-caddy/Caddyfile).
#
# Mindestlänge des Passworts (Planpapier docs/ausrollen-neue-nutzer.md, 4.1): GOTRUE_PASSWORD_MIN_LENGTH=12, gleich wie scripts/wamo_nutzer.py.
# Gemessen in P0: Wechsel durch die Person mit 11 Zeichen ergibt HTTP 422 weak_password; die Admin-Schnittstelle prüft die Länge nicht.
services:
  auth:
    environment:
      GOTRUE_SESSIONS_TIMEBOX: ${SESSIONS_TIMEBOX:-168h}
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: ${SESSIONS_INACTIVITY_TIMEOUT:-72h}
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
